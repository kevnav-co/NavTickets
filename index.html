
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- El manifiesto y los iconos de la PWA serán gestionados e inyectados por Vite -->

  <link rel="icon" type="image/png" href="/assets/icon-app.png">
  <link rel="apple-touch-icon" href="/assets/icon-app.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#7b1113">
  <meta name="application-name" content="NavTickets">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NavTickets">

  <title>NavTickets - Gestión de Mantenimiento</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --safe-area-inset-top: env(safe-area-inset-top, 0px);
      --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overscroll-behavior-y: none;
      padding-top: var(--safe-area-inset-top);
      background-color: #7b1113;
    }
    #root {
      min-height: 100vh;
      background-color: #fafaf9;
    }
    input, textarea, select { color: #1c1917 !important; }
    ::placeholder { color: #a8a29e !important; opacity: 1; }
    nav.fixed.bottom-0 { padding-bottom: calc(1.5rem + var(--safe-area-inset-bottom)); }
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fade-in 0.4s ease-out; }
  </style>
  
</head>
<body class="animate-fade-in">
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
