name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  app:
    name: Tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Migraciones y RLS (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Contenedor efímero del runner: sin contraseña (trust) para no versionar credenciales.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Stubs de Supabase
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/supabase_stubs.sql

      - name: Aplicar migraciones
        run: |
          for f in supabase/migrations/0*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Test de RLS y RPC de Contabilidad
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/accounting_rls.sql
