name: Auto-Versionado

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-version:
    if: "!contains(github.event.head_commit.message, '[skip-version]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Obtener última versión
        id: get_version
        run: |
          # Buscar el último tag que coincida con V1.*
          LAST_TAG=$(git tag --list 'V1.*' --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            echo "No se encontraron tags V1.x. Creando V1.0..."
            NEW_TAG="V1.0"
          else
            echo "Último tag encontrado: $LAST_TAG"
            # Extraer el número después de V1.
            LAST_NUM=$(echo "$LAST_TAG" | sed 's/V1\.//')
            NEW_NUM=$((LAST_NUM + 1))
            NEW_TAG="V1.${NEW_NUM}"
          fi

          echo "Nuevo tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Crear y subir tag
        run: |
          NEW_TAG="${{ steps.get_version.outputs.new_tag }}"
          git config user.name "kevnav-co"
          git config user.email "kevnav-co@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Versión automática $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "✅ Tag $NEW_TAG creado y subido exitosamente"