# ─── Nginx Config for NavTickets SPA ─────────────────────────────
# Serves the built Vite app with proper caching, security headers, and SPA fallback.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ──────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=*" always;

    # ── Service Worker (must not be cached) ──────────────────────
    location /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        expires -1;
        try_files $uri =404;
    }

    location /sw.ts {
        add_header Cache-Control "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    # ── Static Assets (cache aggressively) ───────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA Fallback ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # HTML should not be cached
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            expires -1;
        }
    }

    # ── Deny hidden files ────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Gzip compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/octet-stream image/svg+xml;
}